# Netlify configuration — publish the site/ directory (no build step)
[build]
  command = "npm run build"
  publish = "site"

# Keep CI/Netlify on the same Node major as GitHub Actions.
# Public inbox / from addresses are also stored as Netlify env vars (often
# marked "Contains secret values"). They intentionally appear in site HTML and
# code defaults — omit those keys so secrets scanning does not fail the build.
# Keep scanning enabled for real secrets (RESEND_API_KEY, NOTION_TOKEN, etc.).
[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "CAREERS_NOTIFY_EMAIL,CONTACT_NOTIFY_EMAIL,RESEND_FROM_EMAIL,RESEND_CONTACT_FROM_EMAIL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["data/careers-fallback.json"]

[functions."safe-seed-api"]
  timeout = 26

# Careers + Notion API
[[redirects]]
  from = "/api/jobs"
  to = "/.netlify/functions/jobs"
  status = 200
[[redirects]]
  from = "/api/job-application"
  to = "/.netlify/functions/job-application"
  status = 200
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Safe-Seed demo API proxy — must stay above the /demo/* SPA fallback.
# Do not use a plain redirect to *.hf.space; the private Space needs HF_TOKEN.
[[redirects]]
  from = "/demo/api/*"
  to = "/.netlify/functions/safe-seed-api/:splat"
  status = 200
[[redirects]]
  from = "/demo/api"
  to = "/.netlify/functions/safe-seed-api"
  status = 200

# Approval emails are origin-only; send them into the SPA basename.
[[redirects]]
  from = "/admin/approve/:reqId"
  to = "/demo/admin/approve/:reqId"
  status = 302

# Safe-Seed SPA (existing files such as /demo/assets/* still win).
[[redirects]]
  from = "/demo"
  to = "/demo/index.html"
  status = 200
[[redirects]]
  from = "/demo/*"
  to = "/demo/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets aggressively (query string busts on each deploy)
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/prototypes/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/demo/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/SuccessMetrics_customer_questions_marketing_copy.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

